name: CI - Typecheck, Vitest & Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: backlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URL: "postgresql://postgres:password@localhost:5432/backlog"
      AUTH_SECRET: "ci_test_secret_12345678901234567890"
      AUTH_DISCORD_ID: "ci_placeholder"
      AUTH_DISCORD_SECRET: "ci_placeholder"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Push Drizzle Schema to CI Postgres
        run: pnpm db:push

      - name: Run Monorepo Typecheck
        run: pnpm typecheck

      - name: Run Vitest Unit Tests
        run: pnpm --filter @acme/validators test

      - name: Install Playwright & Run E2E Browser Tests
        run: |
          pnpm --filter @acme/nextjs exec playwright install --with-deps chromium
          pnpm --filter @acme/nextjs test:e2e

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img">
  <title>Empty cartridge shelf with a single cartridge hovering above the center slot</title>
  <style>
    .cart {
      transform-box: fill-box;
      transform-origin: center;
      animation: cart-bob 3s ease-in-out infinite alternate;
    }
    .slot-glow {
      transform-box: fill-box;
      transform-origin: center;
      animation: slot-pulse 3s ease-in-out infinite alternate;
    }
    @keyframes cart-bob {
      0% { transform: translateY(0); }
      100% { transform: translateY(4px); }
    }
    @keyframes slot-pulse {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Shelf base -->
  <g stroke="var(--art-ink, currentColor)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="42" y1="164" x2="258" y2="164" />
    <line x1="56" y1="164" x2="56" y2="169" />
    <line x1="244" y1="164" x2="244" y2="169" />
  </g>

  <!-- Empty muted slots 1, 2, 4, 5 -->
  <g stroke="var(--art-muted, #b6bcad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="var(--art-ink, currentColor)" fill-opacity="0.08">
    <rect x="56" y="112" width="28" height="52" rx="3" />
    <rect x="96" y="112" width="28" height="52" rx="3" />
    <rect x="176" y="112" width="28" height="52" rx="3" />
    <rect x="216" y="112" width="28" height="52" rx="3" />
  </g>

  <!-- Highlighted center slot 3 -->
  <g class="slot-glow" stroke="var(--art-accent, #c8ed78)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="136" y="112" width="28" height="52" rx="3" />
  </g>

  <!-- Hovering cartridge -->
  <g class="cart" stroke="var(--art-ink, currentColor)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 139 52 H 145 V 56 H 155 V 52 H 161 Q 164 52 164 55 V 99 Q 164 102 161 102 H 139 Q 136 102 136 99 V 55 Q 136 52 139 52 Z" fill="var(--art-ink, currentColor)" fill-opacity="0.12" />
    <rect x="141" y="64" width="18" height="24" rx="2" fill="var(--art-ink, currentColor)" fill-opacity="0.08" />
    <line x1="142" y1="96" x2="158" y2="96" stroke="var(--art-muted, #b6bcad)" />
  </g>
</svg>

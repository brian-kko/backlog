<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" role="img">
  <title>Gemuzu retro game cartridge</title>
  <style>
    .label {
      animation: label-fade 2.8s ease-in-out infinite alternate;
    }
    svg.insert {
      animation: cart-insert 1.6s ease-in-out;
    }
    @keyframes label-fade {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }
    @keyframes cart-insert {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      svg, * { animation: none !important; }
    }
  </style>

  <!-- Cartridge body and 5 bottom ridges -->
  <g class="body" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 24 12 H 46 L 49 17 H 71 L 74 12 H 96 Q 102 12 102 18 V 122 Q 102 128 96 128 H 24 Q 18 128 18 122 V 18 Q 18 12 24 12 Z" stroke="var(--art-ink, currentColor)" fill="var(--art-ink, currentColor)" fill-opacity="0.1" />
    <g stroke="var(--art-muted, #b6bcad)">
      <line x1="32" y1="92" x2="88" y2="92" />
      <line x1="32" y1="98" x2="88" y2="98" />
      <line x1="32" y1="104" x2="88" y2="104" />
      <line x1="32" y1="110" x2="88" y2="110" />
      <line x1="32" y1="116" x2="88" y2="116" />
    </g>
  </g>

  <!-- Blank accent label on upper half -->
  <g class="label">
    <rect x="28" y="26" width="64" height="52" rx="4" fill="var(--art-accent, #c8ed78)" stroke="var(--art-ink, currentColor)" stroke-width="2" />
  </g>

  <!-- Connector edge with 8 teeth -->
  <g class="teeth" stroke="var(--art-ink, currentColor)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 33 128 V 136 Q 33 138 35 138 H 85 Q 87 138 87 136 V 128" fill="var(--art-ink, currentColor)" fill-opacity="0.08" />
    <line x1="39" y1="131" x2="39" y2="138" />
    <line x1="45" y1="131" x2="45" y2="138" />
    <line x1="51" y1="131" x2="51" y2="138" />
    <line x1="57" y1="131" x2="57" y2="138" />
    <line x1="63" y1="131" x2="63" y2="138" />
    <line x1="69" y1="131" x2="69" y2="138" />
    <line x1="75" y1="131" x2="75" y2="138" />
    <line x1="81" y1="131" x2="81" y2="138" />
  </g>
</svg>